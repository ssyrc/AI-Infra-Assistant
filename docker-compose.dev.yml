# 개발/데모용. 실제 vLLM/GPU 없이 전체 흐름을 확인한다.
#   docker compose -f docker-compose.dev.yml up -d --build
# dev는 편의를 위해 포트를 열어두고 비밀번호도 고정값을 쓴다(운영에 사용 금지).

x-pg-pass: &pgpass devpass
x-config-dsn: &configdsn postgresql://agent:devpass@postgres:5432/platform_config
x-agent-source-volumes: &agent-source-volumes
  - ./agent_server:/app/agent_server:ro
  - ./shared:/app/shared:ro
x-mcp-source-volumes: &mcp-source-volumes
  - ./mcp_servers:/app/mcp_servers:ro
  - ./shared:/app/shared:ro
x-admin-source-volumes: &admin-source-volumes
  - ./admin_console:/app/admin_console:ro
  - ./shared:/app/shared:ro
  - ./mcp_servers/execution_mcp:/app/mcp_servers/execution_mcp:ro

# 폐쇄망: 사내 미러 레지스트리를 .env로 지정한다(기본은 공개 레지스트리).
#   REGISTRY_DOCKERHUB=repository.samsungds.net/proxy-docker-registry-1.docker.io
#   REGISTRY_GHCR=repository.samsungds.net/proxy-docker-ghcr.io
# 빌드 베이스(python)도 미러에서 받도록 build args로 전달한다.
x-py-build-args: &pyargs
  PYTHON_IMAGE: ${REGISTRY_DOCKERHUB:-docker.io}/python:3.11-slim-bullseye
  # 폐쇄망 pip 미러/프록시(.env). 비우면 공개 PyPI 직접.
  PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
  PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
  BUILD_PROXY: ${BUILD_PROXY:-}
  NO_PROXY: ${NO_PROXY:-}

x-mcp-build-args: &mcpargs
  <<: *pyargs
  APT_MIRROR: ${APT_MIRROR:-}
  APT_HTTP_TIMEOUT: ${APT_HTTP_TIMEOUT:-10}

x-mcp-image: &mcpimage
  image: ai-infra-assistant-mcp:dev
  build: { context: ., dockerfile: dev/Dockerfile.mcp-dev, args: *mcpargs }
  volumes: *mcp-source-volumes

services:
  postgres:
    image: ${REGISTRY_DOCKERHUB:-docker.io}/pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: *pgpass
    volumes:
      - ./shared/init-db:/docker-entrypoint-initdb.d
    # 호스트 포트 충돌 시 .env에서 *_PORT 변수만 바꾸면 된다(컨테이너 내부 포트는 고정).
    ports: ["${PG_PORT:-8507}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  db-init:
    image: ai-infra-assistant-db-init:latest
    build: { context: ., dockerfile: dev/Dockerfile.db-init-dev, args: *pyargs }
    volumes:
      - ./shared:/app/shared:ro
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: *pgpass
      REDIS_HOST: ""          # dev에는 redis 없음 -> 임베딩 캐시 비활성
      MANUAL_MCP_URL: http://manual-mcp:8001/mcp
      EXECUTION_MCP_URL: http://execution-mcp:8002/mcp
      VOC_MCP_URL: http://voc-mcp:8003/mcp
      CHART_MCP_URL: http://chart-mcp:8005/mcp
      # 차트 이미지는 사용자 브라우저가 직접 받아간다 -> 배포 호스트에서 접근 가능한 주소.
      CHART_PUBLIC_BASE_URL: ${CHART_PUBLIC_BASE_URL:-}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # dev 전용: 처음 설치할 때만 설정을 mock vLLM으로 채워둔다 (db-init 이후 실행).
  # updated_by='bootstrap'인 값만 건드린다 -> 관리자가 설정 탭에서 한 번이라도 저장한 값은
  # (updated_by가 admin 계정으로 바뀌므로) `down && up`을 다시 해도 mock으로 되돌아가지 않는다.
  dev-config:
    image: ${REGISTRY_DOCKERHUB:-docker.io}/postgres:16-alpine
    environment:
      PGPASSWORD: *pgpass
    # mock으로 되돌리는 조건이 두 겹이다(둘 다 만족해야 덮어쓴다):
    #  1) updated_by='bootstrap'  - 관리자가 콘솔에서 한 번이라도 저장한 값은 절대 안 건드린다.
    #  2) vllm_llm_base_url이 아직 'CHANGE-ME' 자리표시자 - 즉 .env에 실제 vLLM 주소를 넣어
    #     기동한 환경(실서버)에서는 DB를 새로 만들어도 mock으로 되돌아가지 않는다.
    # 이 두 번째 조건이 없으면, postgres 볼륨이 새로 만들어진 순간 .env의 실제 주소가
    # 시드되자마자 mock으로 덮여서 "설정이 통째로 초기화된" 것처럼 보인다(RUN-LOG #48).
    # redis_url만 예외로 항상 비운다 - dev compose에는 redis 컨테이너 자체가 없다.
    entrypoint: >
      sh -c "psql -h postgres -U agent -d platform_config -c \"
        UPDATE platform_settings SET value='http://mock-vllm:8000/v1' WHERE key IN ('vllm_llm_base_url','vllm_embed_base_url') AND updated_by='bootstrap' AND (SELECT value FROM platform_settings WHERE key='vllm_llm_base_url') LIKE '%CHANGE-ME%';
        UPDATE platform_settings SET value='mock-llm' WHERE key='vllm_llm_model' AND updated_by='bootstrap' AND (SELECT value FROM platform_settings WHERE key='vllm_llm_base_url') = 'http://mock-vllm:8000/v1';
        UPDATE platform_settings SET value='mock-embed' WHERE key='vllm_embed_model' AND updated_by='bootstrap' AND (SELECT value FROM platform_settings WHERE key='vllm_llm_base_url') = 'http://mock-vllm:8000/v1';
        UPDATE platform_settings SET value='' WHERE key='rerank_base_url' AND updated_by='bootstrap' AND (SELECT value FROM platform_settings WHERE key='vllm_llm_base_url') = 'http://mock-vllm:8000/v1';
        UPDATE platform_settings SET value='' WHERE key='redis_url' AND updated_by='bootstrap';\""
    depends_on:
      db-init: { condition: service_completed_successfully }
    restart: "no"

  mock-vllm:
    image: ai-infra-assistant-mock-vllm:latest
    build: { context: ., dockerfile: dev/Dockerfile.mock, args: *pyargs }
    volumes:
      - ./dev/mock_vllm.py:/app/mock_vllm.py:ro
    # 호스트 노출 불필요(agent가 도커 내부망 mock-vllm:8000으로 접속) → 기본적으로
    # 호스트에 포트를 열지 않는다. 직접 curl 디버깅이 필요하면 아래 줄의 주석을 풀어라.
    # ports: ["${MOCK_VLLM_PORT:-8508}:8000"]

  manual-mcp:
    <<: *mcpimage
    command: ["watchfiles", "--filter", "python", "python mcp_servers/manual_mcp/server.py", "mcp_servers/manual_mcp", "shared"]
    environment: { CONFIG_DB_DSN: *configdsn, MCP_PORT: "8001" }
    ports: ["${MANUAL_MCP_PORT:-8503}:8001"]
    depends_on:
      dev-config: { condition: service_completed_successfully }

  # 커맨드 실행 전담(구 command-mcp + system-mcp). 내장 커맨드·등록 커맨드·run_command.
  execution-mcp:
    <<: *mcpimage
    command: ["watchfiles", "--filter", "python", "python mcp_servers/execution_mcp/server.py", "mcp_servers/execution_mcp", "shared"]
    environment:
      CONFIG_DB_DSN: *configdsn
      MCP_PORT: "8002"
      # 대상 서버로 ssh(root) 후 su - <user>로 실행하는 툴(job 조회 등)에 필요.
      HOSTS_FILE: /etc/hosts.targets
      SSH_KEY: /root/.ssh/id_ed25519
      SSH_ROOT_USER: root
      # 호스트 키가 계속 막으면 .env에 SSH_STRICT_HOST_KEY=no 를 넣고 컨테이너를 재생성한다.
      SSH_STRICT_HOST_KEY: ${SSH_STRICT_HOST_KEY:-accept-new}
      # 느린 사내 커맨드(GPFS 쿼터 조회 등)가 중간에 끊기지 않도록 넉넉히.
      SSH_COMMAND_TIMEOUT: ${SSH_COMMAND_TIMEOUT:-120}
      # TTY 강제(기본 off). su가 TTY를 요구하는 환경에서만 true로.
      SSH_FORCE_TTY: ${SSH_FORCE_TTY:-false}
      # 연결 다중화: 첫 커맨드만 핸드셰이크하고 이후는 같은 연결에 얹는다(체감 지연의 대부분).
      SSH_MULTIPLEX: ${SSH_MULTIPLEX:-true}
      SSH_CONTROL_PERSIST: ${SSH_CONTROL_PERSIST:-300}
    volumes:
      - ./mcp_servers:/app/mcp_servers:ro
      - ./shared:/app/shared:ro
      # 대상 서버 IP 매핑(이름으로 지정할 때만 쓰인다 - 로그인 서버는 설정에 IP로 박는다) + ssh 개인키.
      - /etc/hosts:/etc/hosts.targets:ro
      - ${SSH_KEY_PATH:-./secrets/id_ed25519}:/root/.ssh/id_ed25519:ro
    ports: ["${EXECUTION_MCP_PORT:-8504}:8002"]
    depends_on:
      dev-config: { condition: service_completed_successfully }

  voc-mcp:
    <<: *mcpimage
    command: ["watchfiles", "--filter", "python", "python mcp_servers/voc_mcp/server.py", "mcp_servers/voc_mcp", "shared"]
    environment: { CONFIG_DB_DSN: *configdsn, MCP_PORT: "8003" }
    ports: ["${VOC_MCP_PORT:-8505}:8003"]
    depends_on:
      dev-config: { condition: service_completed_successfully }

  # 차트 생성. ssh도 DB도 쓰지 않는다(호출자가 준 숫자만 SVG로 그린다).
  # 생성된 SVG는 같은 포트의 /charts/<이름>.svg로 사용자 브라우저에 직접 서빙된다 →
  # Open WebUI가 접근할 수 있도록 호스트 포트를 연다.
  chart-mcp:
    <<: *mcpimage
    command: ["watchfiles", "--filter", "python", "python mcp_servers/chart_mcp/server.py", "mcp_servers/chart_mcp", "shared"]
    environment:
      CONFIG_DB_DSN: *configdsn
      MCP_PORT: "8005"
      CHART_OUTPUT_DIR: /app/charts
    volumes:
      - ./mcp_servers:/app/mcp_servers:ro
      - ./shared:/app/shared:ro
      - chart_files:/app/charts
    ports: ["${CHART_MCP_PORT:-8509}:8005"]
    depends_on:
      dev-config: { condition: service_completed_successfully }

  agent-server:
    image: ai-infra-assistant-agent-server:latest
    build: { context: ., dockerfile: dev/Dockerfile.agent-dev, args: *pyargs }
    volumes: *agent-source-volumes
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/agent_server", "--reload-dir", "/app/shared"]
    environment:
      CONFIG_DB_DSN: *configdsn
      # LANGFUSE 키 없음 -> 트레이싱 자동 비활성화
      # 호스트 8000이 이미 사용 중이라 8500으로 노출(외부 VOC agent가 접속/방화벽 개통 대상 포트)
    ports: ["${AGENT_PORT:-8500}:8000"]
    depends_on:
      dev-config: { condition: service_completed_successfully }
      mock-vllm: { condition: service_started }
      manual-mcp: { condition: service_started }
      execution-mcp: { condition: service_started }
      voc-mcp: { condition: service_started }
      chart-mcp: { condition: service_started }

  admin-console:
    image: ai-infra-assistant-admin-console:latest
    build: { context: ., dockerfile: dev/Dockerfile.admin-dev, args: *pyargs }
    volumes:
      - ./admin_console:/app/admin_console:ro
      - ./shared:/app/shared:ro
      - ./mcp_servers/execution_mcp:/app/mcp_servers/execution_mcp:ro
      # "서버 파일에서 선택" 업로드용. 호스트 경로는 .env의 UPLOAD_SOURCE_HOST_DIR로 바꿀 수 있다.
      - ${UPLOAD_SOURCE_HOST_DIR:-/home/gpu1/yr9.choi/05_halo/datasets}:/data/uploads:ro
      # 설정/화이트리스트 저장 후 "지금 재시작" 버튼용. admin-console에 사실상 호스트 권한을
      # 주는 마운트이니(임의 컨테이너 실행 가능), 신뢰된 관리자망에서만 쓴다는 전제.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      CONFIG_DB_DSN: *configdsn
      ADMIN_USER: admin
      ADMIN_PASSWORD: admin
    ports: ["${ADMIN_PORT:-8501}:8080"]
    depends_on:
      dev-config: { condition: service_completed_successfully }

  open-webui:
    image: ${REGISTRY_GHCR:-ghcr.io}/open-webui/open-webui:v0.6.5
    environment:
      OPENAI_API_BASE_URL: http://agent-server:8000/v1
      OPENAI_API_KEY: not-needed
      # 로그인/회원가입 화면을 써서 admin 외에 일반 사용자 계정도 만들어 테스트할 수 있게 함
      # (WEBUI_AUTH=false였을 때는 로그인 없이 항상 같은 계정으로 고정돼 다른 계정 테스트가 불가능했음).
      WEBUI_AUTH: "true"
      # 로그인 사용자 정보를 X-OpenWebUI-User-Id/-Email/-Role/-Chat-Id 헤더로 agent-server에
      # 전달한다. "필요 역할(admin 전용)" 검사는 이 헤더가 있어야 실제로 동작한다.
      ENABLE_FORWARD_USER_INFO_HEADERS: "true"
      # 우리 모델 하나만 쓰므로 Open WebUI 내장 Arena 비교 모델은 끈다(모델 목록에 아예 안 뜸).
      ENABLE_EVALUATION_ARENA_MODELS: "false"
    volumes:
      # 계정/대화 데이터가 컨테이너 재생성 시 사라지지 않게 영구 볼륨(prod와 동일 패턴).
      - open_webui_dev_data:/app/backend/data
    ports: ["${OPENWEBUI_PORT:-8502}:8080"]
    depends_on:
      agent-server: { condition: service_started }

volumes:
  open_webui_dev_data:
  # 생성된 차트 SVG. 컨테이너를 다시 만들어도 최근 대화의 그림이 깨지지 않게 볼륨에 둔다.
  chart_files:
