<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agent Platform · 운영 콘솔</title>
<!-- 폐쇄망: /vendor 로컬 파일 사용. dev(인터넷 가능): 파일이 없으면 CDN으로 폴백. -->
<script>
  function loadScript(localSrc, cdnSrc, cb) {
    var s = document.createElement("script");
    s.src = localSrc;
    s.onload = cb;
    s.onerror = function () {
      var f = document.createElement("script");
      f.src = cdnSrc; f.onload = cb; document.head.appendChild(f);
    };
    document.head.appendChild(s);
  }
</script>
<script>
  loadScript("/vendor/react.production.min.js", "https://unpkg.com/react@18/umd/react.production.min.js", function () {
    loadScript("/vendor/react-dom.production.min.js", "https://unpkg.com/react-dom@18/umd/react-dom.production.min.js", function () {
      loadScript("/vendor/babel.min.js", "https://unpkg.com/@babel/standalone/babel.min.js", function () {
        window.__depsReady && window.__depsReady();
      });
    });
  });
</script>
<style>
  :root {
    --bg: #12151a;
    --panel: #1a1e25;
    --panel-2: #20242c;
    --border: #262b33;
    --text: #d7dce2;
    --muted: #7b8492;
    --accent: #3ea88f;   /* published / enabled / success */
    --warn: #d3a54a;     /* draft */
    --danger: #cc6558;   /* archived / disabled / error */
    --mono: ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, monospace;
    --sans: -apple-system, "Segoe UI", "Pretendard", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; }
  #root { display: flex; min-height: 100vh; }

  .sidebar { width: 220px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border); padding: 20px 0; }
  .sidebar h1 { font-size: 14px; letter-spacing: 0.02em; color: var(--muted); padding: 0 20px 16px; margin: 0; text-transform: uppercase; }
  .nav-item { padding: 10px 20px; cursor: pointer; color: var(--muted); border-left: 2px solid transparent; font-size: 13.5px; }
  .nav-item:hover { color: var(--text); }
  .nav-item.active { color: var(--text); border-left-color: var(--accent); background: var(--panel-2); }

  .main { flex: 1; padding: 28px 36px; max-width: 1180px; }
  .main h2 { font-size: 18px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 500; padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; }
  td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:hover td { background: var(--panel-2); }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-family: var(--mono); border-left: 3px solid; }
  .badge.published, .badge.true, .badge.enabled, .badge.success { border-color: var(--accent); color: var(--accent); background: rgba(62,168,143,0.1); }
  .badge.draft { border-color: var(--warn); color: var(--warn); background: rgba(211,165,74,0.1); }
  .badge.archived, .badge.false, .badge.disabled, .badge.error, .badge.blocked { border-color: var(--danger); color: var(--danger); background: rgba(204,101,88,0.1); }

  button { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 6px 12px; font-size: 12.5px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0d1310; font-weight: 600; }
  button.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
  input, textarea, select { background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 4px; padding: 6px 8px; font-size: 13px; font-family: var(--sans); }
  textarea { width: 100%; font-family: var(--mono); font-size: 12.5px; }

  .toolbar { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 16px; margin-bottom: 16px; }
  .chunk { border: 1px solid var(--border); border-radius: 5px; padding: 10px; margin-bottom: 8px; background: var(--panel-2); }
  .chunk .meta { color: var(--muted); font-size: 11px; font-family: var(--mono); margin-bottom: 6px; display: flex; justify-content: space-between; }
  .row-actions { display: flex; gap: 6px; }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; font-size: 13px; }
  .switch { position: relative; width: 36px; height: 20px; display: inline-block; }
  .switch input { display: none; }
  .switch .track { position: absolute; inset: 0; background: var(--danger); border-radius: 10px; cursor: pointer; transition: 0.15s; }
  .switch input:checked + .track { background: var(--accent); }
  .switch .thumb { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; background: #0d1310; border-radius: 50%; transition: 0.15s; }
  .switch input:checked ~ .thumb { transform: translateX(16px); }
  pre.result { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 8px; font-size: 11.5px; max-width: 320px; overflow: auto; white-space: pre-wrap; font-family: var(--mono); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React;

async function api(path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: { "Content-Type": "application/json", ...(options.headers || {}) },
  });
  if (!res.ok) {
    const text = await res.text();
    throw new Error(`${res.status}: ${text}`);
  }
  const ct = res.headers.get("content-type") || "";
  return ct.includes("application/json") ? res.json() : null;
}

function Badge({ value }) {
  const label = typeof value === "boolean" ? (value ? "enabled" : "disabled") : value;
  return <span className={`badge ${String(value)}`}>{label}</span>;
}

// ---------------------------------------------------------------- Manuals
function ManualsPanel() {
  const [manuals, setManuals] = useState([]);
  const [detail, setDetail] = useState(null);
  const [versions, setVersions] = useState([]);
  const [title, setTitle] = useState("");
  const [file, setFile] = useState(null); // 브라우저 File 또는 {name, serverPath} (서버 파일 선택)
  const [showBrowser, setShowBrowser] = useState(false);
  const [busy, setBusy] = useState(false);

  // 정제 옵션 (업로드 시 공통 적용)
  const [opts, setOpts] = useState({ strip_html: true, collapse_space: true, drop_urls: false, include_speaker_notes: false });

  // 문서(docx/pptx/pdf/txt/md) 미리보기 결과
  const [docPreview, setDocPreview] = useState(null); // {upload_id, ext, total_chunks, preview_chunks}
  // 엑셀 미리보기 결과 + 컬럼 선택 상태
  const [excelPreview, setExcelPreview] = useState(null); // {upload_id, columns, sample_rows, total_rows}
  const [contentCols, setContentCols] = useState([]);
  const [titleCol, setTitleCol] = useState("");
  const [pageCol, setPageCol] = useState("");

  const load = useCallback(async () => setManuals(await api("/api/manuals")), []);
  useEffect(() => { load(); }, [load]);

  const openDetail = async (id) => {
    setDetail(await api(`/api/manuals/${id}`));
    setVersions(await api(`/api/manuals/${id}/versions`));
  };

  const extOf = (f) => (f ? f.name.slice(f.name.lastIndexOf(".")).toLowerCase() : "");
  const isExcel = (f) => [".xlsx", ".xls", ".csv"].includes(extOf(f));
  const fileKind = (f) => {
    const e = extOf(f);
    if ([".xlsx", ".xls"].includes(e)) return "엑셀 (열 선택)";
    if (e === ".csv") return "CSV (열 선택)";
    if (e === ".pptx") return "PPT (슬라이드 단위)";
    if ([".docx", ".pdf"].includes(e)) return "문서 (섹션 단위)";
    if ([".txt", ".md"].includes(e)) return "텍스트 (문단 단위)";
    return "";
  };

  const resetPreviews = () => { setDocPreview(null); setExcelPreview(null); setContentCols([]); setTitleCol(""); setPageCol(""); };

  const appendFile = (fd, f) => { if (f.serverPath) fd.append("server_path", f.serverPath); else fd.append("file", f); };

  // 파일을 고르면(로컬/서버 공통) 제목이 비어있을 때만 파일명(확장자 제외)으로 자동 채운다.
  const pickFile = (f) => {
    setFile(f);
    if (f && !title) setTitle(f.name.replace(/\.[^.]+$/, ""));
    resetPreviews();
  };

  const analyze = async () => {
    if (!file) return alert("파일을 먼저 선택하세요.");
    if (!title) return alert("제목을 입력하세요.");
    setBusy(true);
    resetPreviews();
    try {
      if (isExcel(file)) {
        const fd = new FormData();
        appendFile(fd, file);
        fd.append("strip_html", opts.strip_html);
        fd.append("collapse_space", opts.collapse_space);
        fd.append("drop_urls", opts.drop_urls);
        const r = await fetch("/api/manuals/excel/preview", { method: "POST", body: fd });
        if (!r.ok) throw new Error(await r.text());
        setExcelPreview(await r.json());
      } else {
        const fd = new FormData();
        appendFile(fd, file);
        fd.append("strip_html", opts.strip_html);
        fd.append("collapse_space", opts.collapse_space);
        fd.append("drop_urls", opts.drop_urls);
        fd.append("include_speaker_notes", opts.include_speaker_notes);
        const r = await fetch("/api/manuals/preview", { method: "POST", body: fd });
        if (!r.ok) throw new Error(await r.text());
        setDocPreview(await r.json());
      }
    } catch (e) { alert("전처리 실패: " + e.message); }
    setBusy(false);
  };

  const commitDoc = async () => {
    setBusy(true);
    try {
      await api("/api/manuals/commit", {
        method: "POST",
        body: JSON.stringify({ upload_id: docPreview.upload_id, title }),
      });
      resetPreviews(); setTitle(""); setFile(null);
      await load();
      alert("등록 완료. 목록에서 청크를 확인·교정한 뒤 발행하세요.");
    } catch (e) { alert("등록 실패: " + e.message); }
    setBusy(false);
  };

  const commitExcel = async () => {
    if (contentCols.length === 0) return alert("내용으로 쓸 열을 1개 이상 선택하세요.");
    setBusy(true);
    try {
      await api("/api/manuals/excel/commit", {
        method: "POST",
        body: JSON.stringify({
          upload_id: excelPreview.upload_id, title,
          content_columns: contentCols, title_column: titleCol || null,
          page_no_column: pageCol || null,
        }),
      });
      resetPreviews(); setTitle(""); setFile(null);
      await load();
      alert("등록 완료. 목록에서 확인 후 발행하세요.");
    } catch (e) { alert("등록 실패: " + e.message); }
    setBusy(false);
  };

  const toggleContentCol = (c) =>
    setContentCols((p) => (p.includes(c) ? p.filter((x) => x !== c) : [...p, c]));

  const saveChunk = async (chunkId, text) => {
    const fd = new FormData();
    fd.append("chunk_text", text);
    await fetch(`/api/manuals/chunks/${chunkId}`, { method: "PATCH", body: fd });
  };
  const deleteChunk = async (chunkId) => {
    await api(`/api/manuals/chunks/${chunkId}`, { method: "DELETE" });
    openDetail(detail.file.id);
  };
  const publish = async (id) => { await api(`/api/manuals/${id}/publish`, { method: "POST" }); await load(); openDetail(id); };
  const unpublish = async (id) => {
    if (!confirm("발행을 취소하면 즉시 검색·조회에서 제외됩니다. 계속할까요?")) return;
    try { await api(`/api/manuals/${id}/unpublish`, { method: "POST" }); await load(); openDetail(id); }
    catch (e) { alert(e.message); }
  };
  const remove = async (id) => {
    if (!confirm("이 버전을 삭제할까요?")) return;
    try { await api(`/api/manuals/${id}`, { method: "DELETE" }); setDetail(null); await load(); }
    catch (e) { alert(e.message); }
  };

  const OptToggles = () => (
    <div style={{display: "flex", gap: 16, fontSize: 12.5, color: "var(--muted)", flexWrap: "wrap"}}>
      <label><input type="checkbox" checked={opts.strip_html} onChange={e => setOpts({...opts, strip_html: e.target.checked})} /> HTML 태그·엔티티 제거</label>
      <label><input type="checkbox" checked={opts.collapse_space} onChange={e => setOpts({...opts, collapse_space: e.target.checked})} /> 공백·빈 줄 정리</label>
      <label><input type="checkbox" checked={opts.drop_urls} onChange={e => setOpts({...opts, drop_urls: e.target.checked})} /> URL 제거</label>
      <label><input type="checkbox" checked={opts.include_speaker_notes} onChange={e => setOpts({...opts, include_speaker_notes: e.target.checked})} /> PPT 발표자 노트 포함</label>
    </div>
  );

  return (
    <div>
      <h2>매뉴얼 관리</h2>
      <div className="subtitle">
        PPT·Word·PDF·txt는 파일 형식에 맞춰 자동 분할되고, 엑셀·CSV는 열을 골라 등록합니다.
        업로드 시 HTML·불필요한 문자는 자동으로 정제됩니다. 같은 제목으로 재업로드하면 새 버전이 생깁니다.
      </div>

      <div className="card">
        <div className="toolbar">
          <input placeholder="문서 제목 (버전 그룹핑 키)" value={title} onChange={e => setTitle(e.target.value)} style={{width: 260}} />
          <input type="file" accept=".xlsx,.xls,.csv,.docx,.pptx,.pdf,.txt,.md"
                 onChange={e => pickFile(e.target.files[0])} />
          <button onClick={() => setShowBrowser(true)}>서버 파일에서 선택</button>
          {file && <span className="badge" style={{borderColor: "var(--muted)", color: "var(--muted)"}}>
            {file.serverPath ? `서버: ${file.name}` : fileKind(file)}
          </span>}
          <button className="primary" disabled={busy} onClick={analyze}>{busy ? "처리 중..." : "전처리 미리보기"}</button>
        </div>
        <div style={{marginTop: 10}}><OptToggles /></div>
      </div>

      {showBrowser && (
        <ServerFileBrowser
          onClose={() => setShowBrowser(false)}
          onPick={(path, name) => { pickFile({ name, serverPath: path }); setShowBrowser(false); }}
        />
      )}

      {/* 문서 미리보기 */}
      {docPreview && (
        <div className="card">
          <div className="toolbar" style={{justifyContent: "space-between"}}>
            <div><strong>미리보기</strong> · {docPreview.filename} · 총 {docPreview.total_chunks}개 청크
              {docPreview.total_chunks > docPreview.preview_chunks.length && ` (아래는 앞 ${docPreview.preview_chunks.length}개)`}</div>
            <div className="row-actions">
              <button className="primary" disabled={busy} onClick={commitDoc}>이대로 등록</button>
              <button onClick={() => { setDocPreview(null); analyze(); }}>정제 옵션 다시 적용</button>
              <button onClick={resetPreviews}>취소</button>
            </div>
          </div>
          <div>
            {docPreview.preview_chunks.map(c => (
              <div className="chunk" key={c.seq}>
                <div className="meta"><span>{c.section_title || "(제목 없음)"} {c.page_no ? `· p${c.page_no}` : ""} · #{c.seq} · {c.char_count}자</span></div>
                <div style={{whiteSpace: "pre-wrap", fontSize: 12.5}}>{c.chunk_text}</div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* 엑셀 열 선택 */}
      {excelPreview && (
        <div className="card">
          <div style={{marginBottom: 8}}><strong>열 선택</strong> · {excelPreview.filename} · {excelPreview.sheet} · {excelPreview.total_rows}행</div>
          <div className="subtitle">
            행 하나가 검색 청크(chunk) 하나가 됩니다. 아래 표에서 열마다 3가지를 고르세요(전부 선택 사항, 필요한 것만 체크):<br/>
            ① <strong>내용</strong>(체크박스, 여러 개 가능) — 청크 본문에 넣을 열. 체크한 열들이 전부 <code>열이름: 값</code> 줄로 이어붙습니다.<br/>
            ② <strong>제목</strong>(라디오, 최대 1개) — 청크의 소제목으로 쓸 열(예: section, ppt_title).<br/>
            ③ <strong>페이지/순번</strong>(라디오, 최대 1개) — 숫자인 열(예: slide_index)이면 청크의 p번호로 저장.<br/>
            뭘 체크해야 할지 모르겠으면 일단 텍스트/설명이 들어있는 열만 "내용"에 체크해도 충분합니다 — 아래 미리보기로 결과를 바로 확인할 수 있습니다.
          </div>
          <table style={{marginBottom: 12}}>
            <thead><tr><th>① 내용</th><th>② 제목</th><th>③ 페이지/순번</th><th>열 이름</th><th>샘플 값</th></tr></thead>
            <tbody>
              {excelPreview.columns.map((col, i) => (
                <tr key={col + i}>
                  <td><input type="checkbox" checked={contentCols.includes(col)} onChange={() => toggleContentCol(col)} /></td>
                  <td><input type="radio" name="tc" checked={titleCol === col} onChange={() => setTitleCol(col)} /></td>
                  <td><input type="radio" name="pc" checked={pageCol === col} onChange={() => setPageCol(col)} /></td>
                  <td style={{fontFamily: "var(--mono)"}}>{col}</td>
                  <td style={{color: "var(--muted)", fontSize: 12}}>{excelPreview.sample_rows.map(r => r[i]).filter(v => v).slice(0, 3).join(" · ")}</td>
                </tr>
              ))}
            </tbody>
          </table>
          {contentCols.length > 0 && excelPreview.sample_rows[0] && (
            <div style={{marginBottom: 12, padding: 10, border: "1px dashed var(--muted)", borderRadius: 6}}>
              <div style={{fontSize: 12.5, color: "var(--muted)", marginBottom: 6}}>
                미리보기 — 첫 번째 행이 이렇게 저장됩니다:
              </div>
              <div style={{fontSize: 12, color: "var(--muted)", marginBottom: 4}}>
                제목: {titleCol ? (excelPreview.sample_rows[0][excelPreview.columns.indexOf(titleCol)] || "(비어있음)") : "(없음)"}
                {" · "}
                페이지: {pageCol ? (excelPreview.sample_rows[0][excelPreview.columns.indexOf(pageCol)] || "(비어있음)") : "(없음)"}
              </div>
              <pre style={{whiteSpace: "pre-wrap", fontSize: 12.5, margin: 0}}>
                {contentCols.map(c => `${c}: ${excelPreview.sample_rows[0][excelPreview.columns.indexOf(c)] || ""}`).join("\n")}
              </pre>
            </div>
          )}
          <div className="row-actions">
            <button className="primary" disabled={busy || contentCols.length === 0} onClick={commitExcel}>선택한 열로 등록</button>
            {titleCol && <button onClick={() => setTitleCol("")}>제목 열 해제</button>}
            {pageCol && <button onClick={() => setPageCol("")}>페이지 열 해제</button>}
            <button onClick={resetPreviews}>취소</button>
          </div>
        </div>
      )}

      <table>
        <thead><tr><th>제목</th><th>버전</th><th>상태</th><th>유형</th><th>파일명</th><th>업로드</th></tr></thead>
        <tbody>
          {manuals.map(m => (
            <tr key={m.id} onClick={() => openDetail(m.id)} style={{cursor: "pointer"}}>
              <td>{m.title}</td>
              <td>v{m.version}</td>
              <td><Badge value={m.status} /></td>
              <td style={{fontSize: 12, color: "var(--muted)"}}>{m.source_type === "spreadsheet" ? "엑셀" : "문서"}</td>
              <td>{m.filename}</td>
              <td style={{fontSize: 12}}>{m.uploaded_by} · {new Date(m.uploaded_at).toLocaleDateString()}</td>
            </tr>
          ))}
          {manuals.length === 0 && <tr><td colSpan="6" className="empty">등록된 매뉴얼이 없습니다.</td></tr>}
        </tbody>
      </table>

      {detail && (
        <div className="card" style={{marginTop: 20}}>
          <div className="toolbar" style={{justifyContent: "space-between"}}>
            <div><strong>{detail.file.title}</strong> · v{detail.file.version} <Badge value={detail.file.status} /></div>
            <div className="row-actions">
              {detail.file.status !== "published" && <button className="primary" onClick={() => publish(detail.file.id)}>발행</button>}
              {detail.file.status === "published" && <button className="danger" onClick={() => unpublish(detail.file.id)}>발행취소</button>}
              {detail.file.status !== "published" && <button className="danger" onClick={() => remove(detail.file.id)}>삭제</button>}
              <button onClick={() => setDetail(null)}>닫기</button>
            </div>
          </div>
          {versions.length > 1 && (
            <div style={{margin: "10px 0", fontSize: 12.5}}>
              버전 이력: {versions.map(v => (
                <span key={v.id} style={{marginRight: 10}}>
                  v{v.version} <Badge value={v.status} />
                  {v.status === "archived" && <button style={{marginLeft: 4}} onClick={() => publish(v.id)}>롤백</button>}
                </span>
              ))}
            </div>
          )}
          <div style={{marginTop: 12}}>
            {detail.file.status !== "draft" && (
              <div className="subtitle" style={{color: "var(--warn)"}}>
                {detail.file.status === "published"
                  ? "발행 중인 버전은 읽기 전용입니다. 내용을 바꾸려면 발행취소 후 교정하거나, 같은 제목으로 새 버전을 업로드하세요."
                  : "보관된 버전은 읽기 전용입니다. 다시 발행(롤백)하거나 같은 제목으로 새 버전을 업로드하세요."}
              </div>
            )}
            {detail.chunks.map(c => (
              <div className="chunk" key={c.id}>
                <div className="meta">
                  <span>{c.section_title || "(제목 없음)"} {c.page_no ? `· p${c.page_no}` : ""} · #{c.seq} {c.embedded ? "· 임베딩됨" : "· 미임베딩(발행 시 처리)"}</span>
                  {detail.file.status === "draft" && <button className="danger" onClick={() => deleteChunk(c.id)}>삭제</button>}
                </div>
                <textarea defaultValue={c.chunk_text}
                  readOnly={detail.file.status !== "draft"}
                  style={detail.file.status !== "draft" ? {opacity: 0.65, cursor: "not-allowed"} : {}}
                  rows={Math.min(10, Math.max(2, Math.ceil(c.chunk_text.length / 90)))}
                  onBlur={e => { if (detail.file.status === "draft" && e.target.value !== c.chunk_text) saveChunk(c.id, e.target.value); }} />
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}


// ---------------------------------------------------------------- VOC
function VocPanel() {
  const [items, setItems] = useState([]);
  const [q, setQ] = useState("");
  const [form, setForm] = useState({ question: "", answer: "", department: "", resolved: true });
  const [editingId, setEditingId] = useState(null);
  const [showBrowser, setShowBrowser] = useState(false);

  const load = useCallback(async () => {
    const qs = q ? `?q=${encodeURIComponent(q)}` : "";
    setItems(await api(`/api/voc${qs}`));
  }, [q]);
  useEffect(() => { load(); }, [load]);

  const submit = async () => {
    if (!form.question || !form.answer) return alert("질문/답변을 입력하세요.");
    if (editingId) {
      await api(`/api/voc/${editingId}`, { method: "PATCH", body: JSON.stringify(form) });
    } else {
      await api("/api/voc", { method: "POST", body: JSON.stringify(form) });
    }
    setForm({ question: "", answer: "", department: "", resolved: true });
    setEditingId(null);
    load();
  };

  const edit = (row) => { setForm(row); setEditingId(row.id); };
  const remove = async (id) => { if (confirm("삭제할까요?")) { await api(`/api/voc/${id}`, { method: "DELETE" }); load(); } };

  const importFile = async (f) => {
    const fd = new FormData();
    if (f.serverPath) fd.append("server_path", f.serverPath); else fd.append("file", f);
    const r = await fetch("/api/voc/import", { method: "POST", body: fd });
    const data = await r.json();
    if (!r.ok) return alert("가져오기 실패: " + JSON.stringify(data));
    alert(`${data.inserted}건 등록, ${data.skipped || 0}건 제외(조치일/처리내용 없음 또는 불만족류)`);
    load();
  };

  return (
    <div>
      <h2>VOC 이력 관리</h2>
      <div className="subtitle">사용자/운영자 질의응답 이력. VOC MCP가 이 데이터를 하이브리드 검색합니다.</div>

      <div className="card">
        <div className="toolbar">
          <input placeholder="질문" value={form.question} onChange={e => setForm({...form, question: e.target.value})} style={{flex: 1}} />
          <input placeholder="부서(선택)" value={form.department || ""} onChange={e => setForm({...form, department: e.target.value})} style={{width: 140}} />
          <label style={{fontSize: 12.5}}><input type="checkbox" checked={form.resolved} onChange={e => setForm({...form, resolved: e.target.checked})} /> 해결됨</label>
        </div>
        <textarea placeholder="답변" value={form.answer} onChange={e => setForm({...form, answer: e.target.value})} rows={3} style={{width: "100%", marginTop: 8}} />
        <div className="toolbar" style={{marginTop: 8}}>
          <button className="primary" onClick={submit}>{editingId ? "수정 저장" : "등록"}</button>
          {editingId && <button onClick={() => { setEditingId(null); setForm({ question: "", answer: "", department: "", resolved: true }); }}>취소</button>}
          <span style={{marginLeft: "auto", display: "flex", alignItems: "center", gap: 6}}>
            <input type="file" accept=".xlsx" onChange={e => e.target.files[0] && importFile(e.target.files[0])} />
            <button onClick={() => setShowBrowser(true)}>서버 파일에서 선택</button>
            <span style={{fontSize: 11.5, color: "var(--muted)"}}>엑셀 일괄 등록(.xlsx만 지원) — 1행 헤더 Question/Answer 또는 사내 표준 4행 헤더(의뢰내용/조치일/처리내용/만족도) 형식을 자동 인식</span>
          </span>
        </div>
      </div>

      {showBrowser && (
        <ServerFileBrowser
          onClose={() => setShowBrowser(false)}
          onPick={(path, name) => { setShowBrowser(false); importFile({ name, serverPath: path }); }}
        />
      )}

      <div className="toolbar">
        <input placeholder="질문 검색..." value={q} onChange={e => setQ(e.target.value)} style={{width: 260}} />
      </div>

      <table>
        <thead><tr><th>질문</th><th>답변</th><th>부서</th><th>해결</th><th>등록일</th><th></th></tr></thead>
        <tbody>
          {items.map(v => (
            <tr key={v.id}>
              <td style={{maxWidth: 260}}>{v.question}</td>
              <td style={{maxWidth: 320}}>{v.answer}</td>
              <td>{v.department || "-"}</td>
              <td><Badge value={v.resolved} /></td>
              <td>{new Date(v.created_at).toLocaleDateString()}</td>
              <td className="row-actions">
                <button onClick={() => edit(v)}>편집</button>
                <button className="danger" onClick={() => remove(v.id)}>삭제</button>
              </td>
            </tr>
          ))}
          {items.length === 0 && <tr><td colSpan="6" className="empty">기록이 없습니다.</td></tr>}
        </tbody>
      </table>
    </div>
  );
}

// ---------------------------------------------------------------- Commands
function CommandsPanel() {
  const [items, setItems] = useState([]);
  const [form, setForm] = useState({ name: "", description: "", exec_command: "" });
  const [editingId, setEditingId] = useState(null);
  const [busy, setBusy] = useState(false);
  const [showBrowser, setShowBrowser] = useState(false);

  // 엑셀 미리보기 + 열 매핑 상태
  const [excel, setExcel] = useState(null); // {upload_id, filename, columns, sample_rows, total_rows}
  const [map, setMap] = useState({ name_column: "", description_column: "", exec_command_column: "" });

  const load = useCallback(async () => setItems(await api("/api/commands")), []);
  useEffect(() => { load(); }, [load]);

  const submit = async () => {
    if (!form.name || !form.description) return alert("이름/설명을 입력하세요.");
    try {
      if (editingId) await api(`/api/commands/${editingId}`, { method: "PATCH", body: JSON.stringify(form) });
      else await api("/api/commands", { method: "POST", body: JSON.stringify(form) });
      setForm({ name: "", description: "", exec_command: "" });
      setEditingId(null);
      load();
    } catch (e) { alert(e.message); }
  };

  const edit = (row) => { setForm(row); setEditingId(row.id); };
  const remove = async (id) => { if (confirm("삭제할까요?")) { await api(`/api/commands/${id}`, { method: "DELETE" }); load(); } };

  const analyzeExcel = async (f) => {
    if (!f) return;
    setBusy(true);
    setExcel(null);
    try {
      const fd = new FormData();
      if (f.serverPath) fd.append("server_path", f.serverPath); else fd.append("file", f);
      const r = await fetch("/api/commands/excel/preview", { method: "POST", body: fd });
      if (!r.ok) throw new Error(await r.text());
      const data = await r.json();
      setExcel(data);
      // 열 이름 자동 추정
      const guess = (cands) => data.columns.find(c => cands.some(k => c.toLowerCase().includes(k))) || "";
      setMap({
        name_column: guess(["name", "이름", "커맨드", "command", "명령"]),
        description_column: guess(["desc", "설명", "내용"]),
        exec_command_column: guess(["exec", "실행", "명령어"]),
      });
    } catch (e) { alert("전처리 실패: " + e.message); }
    setBusy(false);
  };

  const commitExcel = async () => {
    if (!map.name_column || !map.description_column) return alert("이름/설명 열을 지정하세요.");
    setBusy(true);
    try {
      const data = await api("/api/commands/excel/commit", {
        method: "POST",
        body: JSON.stringify({
          upload_id: excel.upload_id,
          name_column: map.name_column,
          description_column: map.description_column,
          exec_command_column: map.exec_command_column || null,
        }),
      });
      setExcel(null);
      await load();
      alert(`반영 완료 · 신규 ${data.inserted}건, 갱신 ${data.updated}건`);
    } catch (e) { alert("등록 실패: " + e.message); }
    setBusy(false);
  };

  const colSelect = (field, label, required) => (
    <label style={{fontSize: 12.5, display: "flex", flexDirection: "column", gap: 4}}>
      <span style={{color: "var(--muted)"}}>{label}{required ? " *" : ""}</span>
      <select value={map[field]} onChange={e => setMap({...map, [field]: e.target.value})}>
        <option value="">(선택 안 함)</option>
        {excel.columns.map(c => <option key={c} value={c}>{c}</option>)}
      </select>
    </label>
  );

  return (
    <div>
      <h2>커맨드 카탈로그</h2>
      <div className="subtitle">
        Command MCP가 조회 <strong>및 실행</strong>하는 시스템 활용 커맨드 목록입니다.
        여기 등록된 커맨드는 별도 승인 없이 전부 실행 가능합니다(항목별 on/off 화이트리스트는
        System MCP 탭에서만 관리). 실행은 항상 <strong>질문한 사용자 본인 계정 권한</strong>으로,
        기본적으로 로그인 서버에서 이뤄집니다. 항목은 <strong>이름 · 실행 커맨드 · 설명</strong> 3개로 관리합니다.
      </div>

      {items.some(c => !c.embedded) && (
        <div className="card" style={{borderColor: "var(--warn)", color: "var(--warn)", fontSize: 12.5}}>
          {items.filter(c => !c.embedded).length}건은 의미 검색용 임베딩 없이 등록됐습니다(키워드가 정확히
          맞아야만 검색됨). 등록 시점에 임베딩 서버가 응답하지 않았다는 뜻입니다 — 설정 탭의
          임베딩 주소를 확인한 뒤, 해당 항목을 편집 후 저장하면 임베딩이 다시 생성됩니다.
        </div>
      )}

      <div className="card">
        <div className="toolbar">
          <input placeholder="커맨드 이름" value={form.name} onChange={e => setForm({...form, name: e.target.value})} style={{width: 200}} />
          <input placeholder="실행 커맨드 (비우면 이름을 그대로 실행)" value={form.exec_command || ""}
                 onChange={e => setForm({...form, exec_command: e.target.value})}
                 style={{width: 340, fontFamily: "var(--mono)"}} />
        </div>
        <div style={{fontSize: 11.5, color: "var(--muted)", marginTop: 6}}>
          실행 커맨드는 셸 없이 그대로 실행됩니다(파이프 <code>|</code>·리다이렉션 <code>&gt;</code> 사용 불가).
          <code>{"{user_id}"}</code>는 실행 시 질문한 사용자 계정으로 치환됩니다(예: <code>phd info -u {"{user_id}"}</code>).
        </div>
        <textarea placeholder="설명" value={form.description} onChange={e => setForm({...form, description: e.target.value})} rows={2} style={{width: "100%", marginTop: 8}} />
        <div className="toolbar" style={{marginTop: 8}}>
          <button className="primary" onClick={submit}>{editingId ? "수정 저장" : "등록"}</button>
          {editingId && <button onClick={() => { setEditingId(null); setForm({ name: "", description: "", exec_command: "" }); }}>취소</button>}
          <span style={{marginLeft: "auto", display: "flex", alignItems: "center", gap: 6}}>
            <input type="file" accept=".xlsx,.xls,.csv" disabled={busy}
                   onChange={e => { analyzeExcel(e.target.files[0]); e.target.value = ""; }} />
            <button disabled={busy} onClick={() => setShowBrowser(true)}>서버 파일에서 선택</button>
            <span style={{fontSize: 11.5, color: "var(--muted)"}}>엑셀·CSV 일괄 업로드 (열 매핑)</span>
          </span>
        </div>
      </div>

      {showBrowser && (
        <ServerFileBrowser
          onClose={() => setShowBrowser(false)}
          onPick={(path, name) => { setShowBrowser(false); analyzeExcel({ name, serverPath: path }); }}
        />
      )}

      {/* 엑셀 열 매핑 */}
      {excel && (
        <div className="card">
          <div style={{marginBottom: 8}}><strong>열 매핑</strong> · {excel.filename} · {excel.sheet} · {excel.total_rows}행</div>
          <div className="subtitle">
            각 항목에 대응하는 엑셀 열을 고르세요. 이름 기준으로 등록/갱신(upsert)됩니다.
            "실행 커맨드" 열을 지정하지 않으면 커맨드 이름이 그대로 실행됩니다(이름 열이 실제
            커맨드면 매핑하지 않아도 됩니다).
          </div>
          <div style={{display: "flex", gap: 16, flexWrap: "wrap", marginBottom: 12}}>
            {colSelect("name_column", "이름(name)", true)}
            {colSelect("description_column", "설명(description)", true)}
            {colSelect("exec_command_column", "실행 커맨드(exec_command)", false)}
          </div>
          {excel.sample_rows.length > 0 && (
            <table style={{marginBottom: 12}}>
              <thead><tr>{excel.columns.map(c => <th key={c}>{c}</th>)}</tr></thead>
              <tbody>
                {excel.sample_rows.map((r, i) => (
                  <tr key={i}>{excel.columns.map((c, j) => (
                    <td key={j} style={{color: "var(--muted)", fontSize: 12, maxWidth: 220}}>{r[j]}</td>
                  ))}</tr>
                ))}
              </tbody>
            </table>
          )}
          <div className="row-actions">
            <button className="primary" disabled={busy} onClick={commitExcel}>매핑대로 일괄 등록</button>
            <button onClick={() => setExcel(null)}>취소</button>
          </div>
        </div>
      )}

      <table>
        <thead><tr><th>이름</th><th>실행 커맨드</th><th>설명</th><th>수정일</th><th></th></tr></thead>
        <tbody>
          {items.map(c => (
            <tr key={c.id}>
              <td style={{fontFamily: "var(--mono)"}}>{c.name}</td>
              <td style={{fontFamily: "var(--mono)", fontSize: 12}}>
                {c.exec_command || <span style={{color: "var(--muted)"}}>{c.name} (이름 그대로)</span>}
              </td>
              <td>{c.description}</td>
              <td>{new Date(c.updated_at).toLocaleDateString()}</td>
              <td className="row-actions">
                <button onClick={() => edit(c)}>편집</button>
                <button className="danger" onClick={() => remove(c.id)}>삭제</button>
              </td>
            </tr>
          ))}
          {items.length === 0 && <tr><td colSpan="5" className="empty">등록된 커맨드가 없습니다.</td></tr>}
        </tbody>
      </table>
    </div>
  );
}

// admin-console 컨테이너에 마운트된 폴더(설정 탭 upload_source_dir) 안에서 파일을 고르는 모달.
// 매뉴얼/VOC/커맨드 카탈로그 업로드가 공유해서 쓴다.
function ServerFileBrowser({ onPick, onClose }) {
  const [path, setPath] = useState("");
  const [entries, setEntries] = useState([]);
  const [error, setError] = useState("");

  const load = useCallback(async (p) => {
    try {
      const data = await api(`/api/files?path=${encodeURIComponent(p)}`);
      setEntries(data.entries);
      setPath(data.path || "");
      setError("");
    } catch (e) { setError(e.message); }
  }, []);
  useEffect(() => { load(""); }, [load]);

  const up = () => load(path.split("/").slice(0, -1).join("/"));

  return (
    <Modal onClose={onClose}>
      <div style={{fontWeight: 600, marginBottom: 8}}>서버 파일에서 선택</div>
      <div style={{fontSize: 12, color: "var(--muted)", marginBottom: 8, fontFamily: "var(--mono)"}}>/{path}</div>
      {error && (
        <div style={{fontSize: 12.5, color: "var(--danger)", marginBottom: 8}}>
          {error} (관리자 콘솔에 폴더가 마운트됐는지, 설정 탭 upload_source_dir 값을 확인하세요)
        </div>
      )}
      {path && <div className="row-actions" style={{marginBottom: 6}}><button onClick={up}>.. 상위로</button></div>}
      <table>
        <tbody>
          {entries.map(e => (
            <tr key={e.path}>
              <td style={{fontFamily: "var(--mono)", fontSize: 12.5, cursor: "pointer"}}
                  onClick={() => (e.is_dir ? load(e.path) : onPick(e.path, e.name))}>
                {e.is_dir ? "📁 " : "📄 "}{e.name}
              </td>
              <td style={{fontSize: 11, color: "var(--muted)"}}>
                {e.size != null ? `${(e.size / 1024).toFixed(1)}KB` : ""}
              </td>
            </tr>
          ))}
          {entries.length === 0 && !error && <tr><td colSpan="2" className="empty">파일이 없습니다.</td></tr>}
        </tbody>
      </table>
      <div className="row-actions" style={{marginTop: 10}}>
        <button onClick={onClose}>취소</button>
      </div>
    </Modal>
  );
}

function SystemPanel() {
  const [whitelist, setWhitelist] = useState([]);
  const [logs, setLogs] = useState([]);
  const [customCommands, setCustomCommands] = useState([]);
  const [tab, setTab] = useState("whitelist");
  const [edits, setEdits] = useState({}); // tool_name -> {description, roles}
  const [showAddModal, setShowAddModal] = useState(false);
  const [needsRestart, setNeedsRestart] = useState(false);

  const loadWhitelist = useCallback(async () => setWhitelist(await api("/api/system/whitelist")), []);
  const loadLogs = useCallback(async () => setLogs(await api("/api/system/logs")), []);
  const loadCustomCommands = useCallback(async () => setCustomCommands(await api("/api/system/custom-commands")), []);
  useEffect(() => { loadWhitelist(); loadLogs(); loadCustomCommands(); }, [loadWhitelist, loadLogs, loadCustomCommands]);

  const patch = async (name, body) => {
    await api(`/api/system/whitelist/${encodeURIComponent(name)}`, { method: "PATCH", body: JSON.stringify(body) });
    await loadWhitelist();
    setNeedsRestart(true);
  };
  const toggle = (name, enabled) => patch(name, { enabled });

  const baseEdit = (w) => ({
    description: w.description_override || "",
    roles: (w.required_roles || [])[0] || "",
    host_mode: w.host_mode || "target_server",
  });
  const editOf = (w) => edits[w.tool_name] || baseEdit(w);
  const setEdit = (name, patchObj) =>
    setEdits(p => {
      const w = whitelist.find(x => x.tool_name === name);
      const base = p[name] || baseEdit(w);
      return { ...p, [name]: { ...base, ...patchObj } };
    });

  const saveMeta = async (w) => {
    const e = editOf(w);
    const roles = e.roles ? [e.roles] : [];
    const hostModeChanged = e.host_mode !== (w.host_mode || "target_server");
    await patch(w.tool_name, { description: e.description, required_roles: roles, host_mode: e.host_mode });
    setEdits(p => { const n = { ...p }; delete n[w.tool_name]; return n; });
    alert(hostModeChanged
      ? "저장했습니다. 분류(host_mode) 변경은 System MCP 재시작 후 반영됩니다."
      : "저장했습니다. (설명 변경은 System MCP 재시작 후 에이전트에 반영됩니다)");
  };

  // ---- 콘솔에서 등록하는 커스텀 커맨드 ----
  const blankCustomForm = { tool_name: "", description: "", command: "", params: [], roles: "", enabled: false, host_mode: "target_server" };
  const [customForm, setCustomForm] = useState(blankCustomForm);
  const [editingCustomName, setEditingCustomName] = useState(null);

  const resetCustomForm = () => { setCustomForm(blankCustomForm); setEditingCustomName(null); };
  const closeAddModal = () => { setShowAddModal(false); resetCustomForm(); };

  const editCustom = (c) => {
    setCustomForm({
      tool_name: c.tool_name,
      description: c.description,
      command: c.argv_template.join(" "),
      params: c.params.map(p => ({ ...p })),
      roles: (c.required_roles || [])[0] || "",
      enabled: c.enabled,
      host_mode: c.host_mode || "target_server",
    });
    setEditingCustomName(c.tool_name);
    setShowAddModal(true);
  };

  const addParamRow = () => setCustomForm(f => ({ ...f, params: [...f.params, { name: "", type: "str" }] }));
  const updateParamRow = (i, patchObj) =>
    setCustomForm(f => ({ ...f, params: f.params.map((p, idx) => (idx === i ? { ...p, ...patchObj } : p)) }));
  const removeParamRow = (i) => setCustomForm(f => ({ ...f, params: f.params.filter((_, idx) => idx !== i) }));

  const submitCustom = async () => {
    if (!customForm.tool_name || !customForm.description || !customForm.command.trim()) {
      return alert("이름/설명/커맨드를 입력하세요.");
    }
    const argv_template = customForm.command.trim().split(/\s+/);
    const params = customForm.params.filter(p => p.name.trim());
    const roles = customForm.roles ? [customForm.roles] : [];
    const body = {
      tool_name: customForm.tool_name, description: customForm.description,
      argv_template, params, required_roles: roles, enabled: customForm.enabled,
      host_mode: customForm.host_mode,
    };
    try {
      if (editingCustomName) {
        await api(`/api/system/custom-commands/${encodeURIComponent(editingCustomName)}`, { method: "PATCH", body: JSON.stringify(body) });
      } else {
        await api("/api/system/custom-commands", { method: "POST", body: JSON.stringify(body) });
      }
      closeAddModal();
      await loadCustomCommands();
      setNeedsRestart(true);
      alert("저장했습니다. 아래 'System MCP 재시작' 버튼을 눌러 바로 반영할 수 있습니다.");
    } catch (e) { alert(e.message); }
  };

  const removeCustom = async (name) => {
    if (!confirm(`'${name}' 커맨드를 삭제할까요?`)) return;
    await api(`/api/system/custom-commands/${encodeURIComponent(name)}`, { method: "DELETE" });
    await loadCustomCommands();
    setNeedsRestart(true);
  };

  const toggleCustom = async (c, enabled) => {
    await api(`/api/system/custom-commands/${encodeURIComponent(c.tool_name)}`, {
      method: "PATCH",
      body: JSON.stringify({
        tool_name: c.tool_name, description: c.description, argv_template: c.argv_template,
        params: c.params, required_roles: c.required_roles, enabled,
      }),
    });
    await loadCustomCommands();
    setNeedsRestart(true);
  };

  const RoleSelect = ({ value, onChange }) => (
    <select value={value} onChange={e => onChange(e.target.value)}>
      <option value="">전체 허용</option>
      <option value="admin">admin 전용</option>
    </select>
  );

  const HostModeSelect = ({ value, onChange }) => (
    <select value={value} onChange={e => onChange(e.target.value)}>
      <option value="target_server">해당 서버 실행 (LLM이 서버명 지정)</option>
      <option value="login_server">로그인 서버 실행 (host 자동 고정)</option>
    </select>
  );

  return (
    <div>
      <h2>System MCP</h2>
      <div className="subtitle">화이트리스트 함수의 활성/비활성·설명·필요 역할을 편집하고 실행 감사로그를 봅니다. "추가" 버튼으로 코드 배포 없이 새 커맨드를 등록할 수 있습니다(등록 후 System MCP 재시작 필요).</div>

      <div className="toolbar">
        <button className={tab === "whitelist" ? "primary" : ""} onClick={() => setTab("whitelist")}>화이트리스트</button>
        <button className={tab === "logs" ? "primary" : ""} onClick={() => setTab("logs")}>실행 로그</button>
      </div>

      {tab === "whitelist" && (
        <div>
          <div className="card" style={{fontSize: 12.5, color: "var(--muted)"}}>
            <div>· <strong style={{color: "var(--accent)"}}>사용자 범위</strong> 툴은 <code>user_id</code>를 LLM에 노출하지 않고 호출자 본인 id로 고정합니다(남의 자원 조회 불가).</div>
            <div style={{marginTop: 4}}>· <strong style={{color: "var(--warn)"}}>필요 역할</strong>을 "admin 전용"으로 하면 Open WebUI에 admin으로 로그인한 사용자만 실행할 수 있습니다(dev 구성은 로그인이 없어 항상 거부됨 - 프로덕션에서만 동작).</div>
          </div>

          <div className="toolbar" style={{marginBottom: 4}}>
            <button className="primary" onClick={() => { resetCustomForm(); setShowAddModal(true); }}>+ 커맨드 추가</button>
            {needsRestart && (
              <button style={{fontWeight: 600}}
                onClick={async () => { await restartService("system-mcp"); setNeedsRestart(false); }}>
                ⚠ System MCP 재시작 (변경사항 반영)
              </button>
            )}
          </div>

          {whitelist.map(w => {
            const e = editOf(w);
            const dirty = w.tool_name in edits;
            return (
              <div className="card" key={w.tool_name}>
                <div className="toolbar" style={{justifyContent: "space-between"}}>
                  <div>
                    <span style={{fontFamily: "var(--mono)"}}>{w.tool_name}</span>
                    {w.user_scoped && <span className="badge enabled" style={{marginLeft: 8}}>사용자 범위</span>}
                  </div>
                  <div style={{display: "flex", alignItems: "center", gap: 8}}>
                    <label className="switch">
                      <input type="checkbox" checked={w.enabled} onChange={ev => toggle(w.tool_name, ev.target.checked)} />
                      <span className="track"></span><span className="thumb"></span>
                    </label>
                    <Badge value={w.enabled} />
                  </div>
                </div>
                {w.example_command && (
                  <div style={{marginTop: 6, fontFamily: "var(--mono)", fontSize: 12, color: "var(--muted)"}}>
                    $ {w.example_command}
                  </div>
                )}
                <div style={{marginTop: 8, fontSize: 12.5, color: "var(--muted)"}}>설명 (에이전트가 보는 툴 설명)</div>
                <textarea rows={2} style={{width: "100%", marginTop: 4}}
                  placeholder={w.code_description}
                  value={e.description}
                  onChange={ev => setEdit(w.tool_name, { description: ev.target.value })} />
                <div style={{display: "flex", gap: 8, alignItems: "flex-end", marginTop: 8, flexWrap: "wrap"}}>
                  <label style={{fontSize: 12.5, color: "var(--muted)"}}>
                    <div>필요 역할</div>
                    <RoleSelect value={e.roles} onChange={v => setEdit(w.tool_name, { roles: v })} />
                  </label>
                  <label style={{fontSize: 12.5, color: "var(--muted)"}}>
                    <div>분류 (호스트 처리 방식)</div>
                    <HostModeSelect value={e.host_mode} onChange={v => setEdit(w.tool_name, { host_mode: v })} />
                  </label>
                  <button className="primary" disabled={!dirty} onClick={() => saveMeta(w)}>저장</button>
                  {dirty && <button onClick={() => setEdits(p => { const n = { ...p }; delete n[w.tool_name]; return n; })}>되돌리기</button>}
                </div>
                <div style={{marginTop: 6, fontSize: 11.5, color: "var(--muted)"}}>
                  {w.updated_by ? `최근 변경: ${w.updated_by} · ${new Date(w.updated_at).toLocaleString()}` : "변경 이력 없음(코드 기본값)"}
                </div>
              </div>
            );
          })}

          {customCommands.length > 0 && (
            <div style={{marginTop: 16, marginBottom: 8, fontSize: 12.5, color: "var(--muted)"}}>
              <strong>콘솔에서 추가한 커맨드</strong>
            </div>
          )}
          {customCommands.map(c => (
            <div className="card" key={c.tool_name}>
              <div className="toolbar" style={{justifyContent: "space-between"}}>
                <span style={{fontFamily: "var(--mono)"}}>{c.tool_name}</span>
                <div style={{display: "flex", alignItems: "center", gap: 8}}>
                  <label className="switch">
                    <input type="checkbox" checked={c.enabled} onChange={ev => toggleCustom(c, ev.target.checked)} />
                    <span className="track"></span><span className="thumb"></span>
                  </label>
                  <Badge value={c.enabled} />
                </div>
              </div>
              <div style={{marginTop: 6, fontFamily: "var(--mono)", fontSize: 12, color: "var(--muted)"}}>
                $ {c.argv_template.join(" ")}
              </div>
              <div style={{marginTop: 4, fontSize: 12.5, color: "var(--muted)"}}>{c.description}</div>
              <div style={{marginTop: 8, fontSize: 12.5, color: "var(--muted)"}}>
                필요 역할: {(c.required_roles || []).join(", ") || "전체 허용"}
              </div>
              <div className="row-actions" style={{marginTop: 8}}>
                <button onClick={() => editCustom(c)}>편집</button>
                <button className="danger" onClick={() => removeCustom(c.tool_name)}>삭제</button>
              </div>
            </div>
          ))}
        </div>
      )}

      {showAddModal && (
        <Modal onClose={closeAddModal}>
          <div style={{fontWeight: 600, marginBottom: 8}}>{editingCustomName ? `수정: ${editingCustomName}` : "새 커맨드 추가"}</div>
          <div style={{fontSize: 12.5, color: "var(--muted)", marginBottom: 10}}>
            항상 호출자 본인 권한으로만 실행됩니다(user_id 자동 주입).
            셸을 거치지 않고 토큰 그대로 실행되며(파이프/세미콜론 등 셸 문법 불가), <code>{"{파라미터명}"}</code> 토큰만
            아래 파라미터 값으로 치환됩니다. rm/dd/systemctl 등 위험한 기본 명령은 등록이 거부됩니다.
            아래 "분류"가 <strong>해당 서버 실행</strong>이면 host를 LLM이 지정해야 하고(서버마다 결과가
            다른 커맨드), <strong>로그인 서버 실행</strong>이면 host가 아예 LLM에 안 보이고 로그인 서버
            (설정 탭 <code>scheduler_login_host</code>)로 자동 고정됩니다.
            <strong style={{color: "var(--warn)"}}> 등록/수정 후 System MCP 재시작이 필요합니다.</strong>
          </div>
          <div className="toolbar">
            <input placeholder="이름(예: disk_iostat)" value={customForm.tool_name} disabled={!!editingCustomName}
              onChange={e => setCustomForm({...customForm, tool_name: e.target.value})} style={{width: 200}} />
          </div>
          <textarea placeholder="설명 (에이전트가 보는 툴 설명)" rows={2} style={{width: "100%", marginTop: 8}}
            value={customForm.description} onChange={e => setCustomForm({...customForm, description: e.target.value})} />
          <input placeholder="커맨드 (예: iostat -x 1 {count})" style={{width: "100%", marginTop: 8}}
            value={customForm.command} onChange={e => setCustomForm({...customForm, command: e.target.value})} />

          <div style={{marginTop: 10, fontSize: 12.5, color: "var(--muted)"}}>파라미터 (커맨드의 {"{이름}"} 토큰과 이름이 같아야 함)</div>
          {customForm.params.map((p, i) => (
            <div key={i} className="toolbar" style={{marginTop: 6}}>
              <input placeholder="파라미터명(예: count)" value={p.name}
                onChange={e => updateParamRow(i, { name: e.target.value })} style={{width: 180}} />
              <select value={p.type} onChange={e => updateParamRow(i, { type: e.target.value })}>
                <option value="str">문자열</option>
                <option value="int">정수</option>
              </select>
              <button className="danger" onClick={() => removeParamRow(i)}>삭제</button>
            </div>
          ))}
          <div style={{marginTop: 6}}><button onClick={addParamRow}>+ 파라미터 추가</button></div>

          <div style={{display: "flex", gap: 8, alignItems: "flex-end", marginTop: 10, flexWrap: "wrap"}}>
            <label style={{fontSize: 12.5, color: "var(--muted)"}}>
              <div>필요 역할</div>
              <RoleSelect value={customForm.roles} onChange={v => setCustomForm({...customForm, roles: v})} />
            </label>
            <label style={{fontSize: 12.5, color: "var(--muted)"}}>
              <div>분류 (호스트 처리 방식)</div>
              <HostModeSelect value={customForm.host_mode} onChange={v => setCustomForm({...customForm, host_mode: v})} />
            </label>
            <label style={{fontSize: 12.5, color: "var(--muted)", display: "flex", alignItems: "center", gap: 6}}>
              <input type="checkbox" checked={customForm.enabled}
                onChange={e => setCustomForm({...customForm, enabled: e.target.checked})} /> 활성화
            </label>
          </div>
          <div className="row-actions" style={{marginTop: 10}}>
            <button className="primary" onClick={submitCustom}>{editingCustomName ? "수정 저장" : "등록"}</button>
            <button onClick={closeAddModal}>취소</button>
          </div>
        </Modal>
      )}

      {tab === "logs" && (
        <table>
          <thead><tr><th>시각</th><th>툴</th><th>요청자</th><th>상태</th><th>파라미터</th><th>결과</th></tr></thead>
          <tbody>
            {logs.map(l => (
              <tr key={l.id}>
                <td style={{fontSize: 11.5}}>{new Date(l.created_at).toLocaleString()}</td>
                <td style={{fontFamily: "var(--mono)"}}>{l.tool_name}</td>
                <td>{l.requested_by}</td>
                <td><Badge value={l.status} /></td>
                <td><pre className="result">{JSON.stringify(l.params, null, 1)}</pre></td>
                <td><pre className="result">{JSON.stringify(l.result, null, 1)}</pre></td>
              </tr>
            ))}
            {logs.length === 0 && <tr><td colSpan="6" className="empty">실행 이력이 없습니다.</td></tr>}
          </tbody>
        </table>
      )}
    </div>
  );
}

// ---------------------------------------------------------------- Settings
// service_hub_mcp_url은 방화벽 개통 후 넣는 실제 외부 주소라 자유 입력, 나머지 *_mcp_url은
// 같은 docker compose 스택의 내부망 컨테이너 이름이라 포트만 바꾸게 제한한다.
const INTERNAL_MCP_URL_RE = /^(https?:\/\/[^:/]+:)(\d+)(\/.*)?$/;
const isInternalMcpUrl = (key) => key.endsWith("_mcp_url") && key !== "service_hub_mcp_url";

// "재시작 필요" 값을 저장한 뒤 바로 눌러서 반영할 수 있는 서비스 매핑(System MCP 탭도 재사용).
const RESTART_SERVICE_FOR_KEY = {
  manual_mcp_url: "manual-mcp",
  command_mcp_url: "command-mcp",
  voc_mcp_url: "voc-mcp",
  system_mcp_url: "system-mcp",
  agent_system_instruction: "agent-server",
};

async function restartService(service) {
  if (!confirm(`'${service}' 컨테이너를 지금 재시작할까요? (짧게 서비스가 끊깁니다)`)) return;
  try {
    const data = await api(`/api/ops/restart/${encodeURIComponent(service)}`, { method: "POST" });
    alert(`재시작했습니다: ${data.restarted.join(", ")}`);
  } catch (e) {
    alert("재시작 실패: " + e.message);
  }
}

async function syncOpenWebUIModel() {
  try {
    const data = await api("/api/ops/sync-openwebui-model", { method: "POST" });
    alert(`Open WebUI 기본 모델을 "${data.default_model}"(으)로 지정했습니다.`);
  } catch (e) {
    alert("동기화 실패: " + e.message);
  }
}

function SettingsPanel() {
  const [settings, setSettings] = useState([]);
  const [edits, setEdits] = useState({}); // key -> new value

  const load = useCallback(async () => setSettings(await api("/api/settings")), []);
  useEffect(() => { load(); }, [load]);

  const save = async (key) => {
    if (!(key in edits)) return;
    await api(`/api/settings/${encodeURIComponent(key)}`, { method: "PUT", body: JSON.stringify({ value: edits[key] }) });
    const next = { ...edits }; delete next[key]; setEdits(next);
    await load();
    alert("저장했습니다.");
  };

  // DB DSN/시크릿(.env 관리)은 콘솔에서 바꿔도 아무 효과가 없어서 아예 화면에 안 보여준다.
  const editable = settings.filter(s => !s.env_managed);

  const grouped = {
    "LLM": editable.filter(s => s.key === "vllm_llm_base_url" || s.key === "vllm_llm_model"),
    "임베딩": editable.filter(s =>
      s.key === "vllm_embed_base_url" || s.key === "vllm_embed_model"
      || s.key === "embed_dim" || s.key === "embed_cache_ttl_seconds"),
    "리랭커": editable.filter(s => s.key.startsWith("rerank_")),
    "검색 품질 / 업로드": editable.filter(s =>
      s.key === "clean_policy_version" || s.key.startsWith("search_") || s.key.startsWith("upload_")),
    "MCP 엔드포인트": editable.filter(s => s.key.endsWith("_mcp_url")),
    "SSH 실행 (System/Command MCP)": editable.filter(s => s.key === "scheduler_login_host"),
    "Open WebUI 연동": editable.filter(s => s.key.startsWith("openwebui_")),
    "에이전트 지시문": editable.filter(s => s.key === "agent_system_instruction"),
  };
  const shown = new Set(Object.values(grouped).flat().map(s => s.key));
  const others = editable.filter(s => !shown.has(s.key));
  if (others.length) grouped["기타"] = others;

  return (
    <div>
      <h2>설정</h2>
      <div className="subtitle">
        LLM·리랭커·스케줄러 주소, MCP 엔드포인트, 에이전트 지시문을 여기서 관리합니다(런타임 단일 소스).
        <span className="badge enabled" style={{marginLeft: 8}}>즉시 반영</span>은 재시작 없이 적용,
        <span className="badge disabled" style={{marginLeft: 6}}>재시작 필요</span>는 해당 서비스 재시작 후 반영됩니다.
        DB DSN·시크릿류는 <code>.env</code>로만 관리되어(콘솔에서 바꿔도 반영 안 됨) 여기서는 표시하지 않습니다.
      </div>

      {Object.entries(grouped).map(([group, rows]) => rows.length > 0 && (
        <div className="card" key={group}>
          <div style={{marginBottom: 10}}><strong>{group}</strong></div>
          {group === "MCP 엔드포인트" && (
            <div style={{fontSize: 12.5, color: "var(--warn)", marginBottom: 10,
                         padding: "8px 10px", background: "var(--bg)", border: "1px solid var(--border)", borderRadius: 4}}>
              ⚠️ 이 값들은 외부 IP가 아니라 <strong>같은 docker compose 스택 안 컨테이너 이름</strong>입니다
              (예: <code>http://command-mcp:8002/mcp</code>). agent-server가 이 이름으로 내부망에서 MCP에
              접속하며, 외부 서버 IP로 바꾸면 연결이 끊깁니다. 여러 물리 서버에 MCP를 나눠 배포하는
              경우가 아니라면 건드리지 마세요.
            </div>
          )}
          {group === "LLM" && (
            <div style={{fontSize: 12.5, color: "var(--muted)", marginBottom: 10,
                         padding: "8px 10px", background: "var(--bg)", border: "1px solid var(--border)", borderRadius: 4}}>
              Open WebUI는 여기 값을 바꿔도 새 채팅의 기본 모델을 자동으로 맞추지 않습니다(브라우저별
              마지막 선택을 따로 기억함). 아래 버튼으로 Open WebUI의 기본 모델을 지금 노출 중인 모델로
              맞출 수 있습니다(<code>openwebui_admin_api_key</code> 설정 필요 — Open WebUI 로그인 →
              설정 → 계정 → API 키 발급 후 아래 "Open WebUI 연동" 그룹에서 저장).
              <div style={{marginTop: 6}}>
                <button onClick={syncOpenWebUIModel}>Open WebUI 기본 모델 동기화</button>
              </div>
            </div>
          )}
          {group === "SSH 실행 (System/Command MCP)" && (
            <div style={{fontSize: 12.5, color: "var(--muted)", marginBottom: 10,
                         padding: "8px 10px", background: "var(--bg)", border: "1px solid var(--border)", borderRadius: 4}}>
              System/Command MCP가 job 조회 등에 ssh할 로그인 서버 이름(호스트의 <code>/etc/hosts</code>에
              등록된 이름이어야 함). System MCP의 <code>disk_free</code> 등 개별 툴의 <code>host</code>
              파라미터와는 별개 설정 — 그쪽은 에이전트 지시문에서 기본 호스트를 알려줘야 함.
            </div>
          )}
          {rows.map(s => {
            const isLong = s.key === "agent_system_instruction";
            const val = s.key in edits ? edits[s.key] : (s.is_secret ? "" : s.value);
            return (
              <div key={s.key} style={{marginBottom: 14}}>
                <div style={{fontSize: 12.5, marginBottom: 4}}>
                  <span style={{fontFamily: "var(--mono)"}}>{s.key}</span>
                  <span className={`badge ${s.hot_reload ? "enabled" : "disabled"}`} style={{marginLeft: 8}}>
                    {s.hot_reload ? "즉시 반영" : "재시작 필요"}
                  </span>
                  {!s.hot_reload && RESTART_SERVICE_FOR_KEY[s.key] && (
                    <button style={{marginLeft: 8, fontSize: 11.5, padding: "1px 6px"}}
                      onClick={() => restartService(RESTART_SERVICE_FOR_KEY[s.key])}>
                      {RESTART_SERVICE_FOR_KEY[s.key]} 재시작
                    </button>
                  )}
                  {s.description && <span style={{color: "var(--muted)", marginLeft: 8}}>{s.description}</span>}
                </div>
                {isInternalMcpUrl(s.key) && INTERNAL_MCP_URL_RE.test(val) ? (
                  (() => {
                    const m = val.match(INTERNAL_MCP_URL_RE);
                    const [, prefix, port, suffix] = m;
                    return (
                      <div style={{display: "flex", gap: 8, alignItems: "center"}}>
                        <span style={{fontFamily: "var(--mono)", fontSize: 12.5, color: "var(--muted)"}}>{prefix}</span>
                        <input type="number" style={{width: 90}} value={port}
                          onChange={e => setEdits({ ...edits, [s.key]: `${prefix}${e.target.value}${suffix || ""}` })} />
                        <span style={{fontFamily: "var(--mono)", fontSize: 12.5, color: "var(--muted)"}}>{suffix}</span>
                        <button className="primary" disabled={!(s.key in edits)} onClick={() => save(s.key)}>저장</button>
                      </div>
                    );
                  })()
                ) : (
                  <div style={{display: "flex", gap: 8, alignItems: "flex-start"}}>
                    {isLong ? (
                      <textarea
                        style={{flex: 1}} rows={10}
                        placeholder={s.is_secret ? `(현재: ${s.value})` : ""}
                        value={val}
                        onChange={e => setEdits({ ...edits, [s.key]: e.target.value })}
                      />
                    ) : (
                      <input
                        style={{flex: 1}}
                        placeholder={s.is_secret ? `(마스킹됨: ${s.value})` : ""}
                        value={val}
                        onChange={e => setEdits({ ...edits, [s.key]: e.target.value })}
                      />
                    )}
                    <button className="primary" disabled={!(s.key in edits)} onClick={() => save(s.key)}>저장</button>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      ))}
    </div>
  );
}

// ---------------------------------------------------------------- Accounts
function AccountsPanel() {
  const [accounts, setAccounts] = useState([]);
  const [form, setForm] = useState({ username: "", password: "" });
  const [pwEdits, setPwEdits] = useState({}); // username -> new password

  const load = useCallback(async () => setAccounts(await api("/api/accounts")), []);
  useEffect(() => { load(); }, [load]);

  const create = async () => {
    if (!form.username || !form.password) return alert("아이디/비밀번호를 입력하세요.");
    try {
      await api("/api/accounts", { method: "POST", body: JSON.stringify(form) });
      setForm({ username: "", password: "" });
      await load();
    } catch (e) { alert(e.message); }
  };

  const changePassword = async (username) => {
    const pw = pwEdits[username];
    if (!pw) return;
    try {
      await api(`/api/accounts/${encodeURIComponent(username)}/password`, {
        method: "PUT", body: JSON.stringify({ password: pw }),
      });
      setPwEdits(p => { const n = { ...p }; delete n[username]; return n; });
      alert("비밀번호를 변경했습니다.");
    } catch (e) { alert(e.message); }
  };

  const remove = async (username) => {
    if (!confirm(`'${username}' 계정을 삭제할까요?`)) return;
    await api(`/api/accounts/${encodeURIComponent(username)}`, { method: "DELETE" });
    await load();
  };

  return (
    <div>
      <h2>계정 관리</h2>
      <div className="subtitle">관리자 콘솔 로그인 계정(HTTP Basic)을 관리합니다. `.env`의 기본 계정은 잠금 방지용이라 여기서 지울 수 없습니다.</div>

      <div className="card">
        <div style={{fontWeight: 600, marginBottom: 8}}>새 계정 추가</div>
        <div className="toolbar">
          <input placeholder="아이디" value={form.username}
            onChange={e => setForm({...form, username: e.target.value})} style={{width: 200}} />
          <input type="password" placeholder="비밀번호(8자 이상)" value={form.password}
            onChange={e => setForm({...form, password: e.target.value})} style={{width: 200}} />
          <button className="primary" onClick={create}>추가</button>
        </div>
      </div>

      <table>
        <thead><tr><th>아이디</th><th>구분</th><th>생성</th><th>비밀번호 변경</th><th></th></tr></thead>
        <tbody>
          {accounts.map(a => (
            <tr key={a.username}>
              <td style={{fontFamily: "var(--mono)"}}>{a.username}</td>
              <td>{a.env_account ? <span className="badge enabled">.env 기본 계정</span> : "콘솔 등록"}</td>
              <td style={{fontSize: 11.5, color: "var(--muted)"}}>
                {a.created_at ? new Date(a.created_at).toLocaleString() : "-"}
              </td>
              <td>
                {!a.env_account && (
                  <div className="toolbar">
                    <input type="password" placeholder="새 비밀번호" style={{width: 160}}
                      value={pwEdits[a.username] || ""}
                      onChange={e => setPwEdits({...pwEdits, [a.username]: e.target.value})} />
                    <button disabled={!pwEdits[a.username]} onClick={() => changePassword(a.username)}>변경</button>
                  </div>
                )}
              </td>
              <td className="row-actions">
                {!a.env_account && <button className="danger" onClick={() => remove(a.username)}>삭제</button>}
              </td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

// ---------------------------------------------------------------- App
function App() {
  const [tab, setTab] = useState("manuals");
  const tabs = [
    { id: "manuals", label: "매뉴얼" },
    { id: "voc", label: "VOC 이력" },
    { id: "commands", label: "커맨드 카탈로그" },
    { id: "system", label: "System MCP" },
    { id: "settings", label: "설정" },
    { id: "accounts", label: "계정 관리" },
  ];
  return (
    <React.Fragment>
      <div className="sidebar">
        <h1>Agent Platform</h1>
        {tabs.map(t => (
          <div key={t.id} className={`nav-item ${tab === t.id ? "active" : ""}`} onClick={() => setTab(t.id)}>{t.label}</div>
        ))}
      </div>
      <div className="main">
        {tab === "manuals" && <ManualsPanel />}
        {tab === "voc" && <VocPanel />}
        {tab === "commands" && <CommandsPanel />}
        {tab === "system" && <SystemPanel />}
        {tab === "settings" && <SettingsPanel />}
        {tab === "accounts" && <AccountsPanel />}
      </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

  window.__depsReady = function () {
